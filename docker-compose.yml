version: '3'
services:
  parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishing_parser
    volumes:
      - ./db:/app/db
      - ./logging:/app/logging
      - ./dataset:/app/dataset
    environment:
      - DB_PATH=/app/db/phishing_sites_${CURRENT_TIME}.db
      - THREADS=8
      - CURRENT_TIME=${CURRENT_TIME}
    networks:
      - parser_network

networks:
  parser_network:
    driver: bridge
